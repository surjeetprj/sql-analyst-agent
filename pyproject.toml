[project]
name = "sql-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cube-http-client>=0.6.1",
    "deepeval>=3.9.9",
    "fastapi[standard]>=0.136.1",
    "langchain-core>=1.3.2",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langsmith>=0.8.0",
    "modal>=1.4.2",
    "pandas>=3.0.2",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.57.0",
]

[tool.pyright]
# This tells your IDE's language server (Pylance/Pyright) to use the project root
# as the base for imports, rather than incorrectly inferring the 'src' folder.
extraPaths = ["."]
executionEnvironments = [{ root = "." }]
