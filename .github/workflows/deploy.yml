name: Enterprise SQL Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install --system fastapi[standard] pydantic-settings sqlalchemy asyncpg langchain-groq langchain-core langgraph PyJWT
          
      - name: Run Golden Dataset Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: "dummy"
          POSTGRES_PASSWORD: "dummy"
          POSTGRES_DB: "dummy"
        run: |
          python tests/run_evals.py

      - name: Deploy to Modal (Serverless Backend)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv pip install --system modal
          modal deploy deploy.py
